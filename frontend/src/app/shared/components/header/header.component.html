<header class="header">
  <!-- Left Page Title / Breadcrumb or Search Bar -->
  <div class="header-left">
    @if (title) {
      <div class="header-page-heading">
        <h1 class="header-title">{{ title }}</h1>
        @if (subtitle) {
          <p class="header-subtitle">{{ subtitle }}</p>
        }
      </div>
    } @else {
      <div class="header-search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="text"
          placeholder="Tìm kiếm hội thoại, bình luận, khách hàng... (Ctrl + K)"
          class="search-input"
        />
      </div>
    }
  </div>

  <!-- Right Actions -->
  <div class="header-right">
    <!-- Channel Fast Filter -->
    <div class="channel-filter-group">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="filter-icon">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
      </svg>
      <button
        class="filter-btn"
        [class.active]="state.selectedChannelFilter() === 'ALL'"
        (click)="state.setChannelFilter('ALL')"
      >
        Tất cả
      </button>
      <button
        class="filter-btn"
        [class.active]="state.selectedChannelFilter() === 'FACEBOOK'"
        (click)="state.setChannelFilter('FACEBOOK')"
      >
        Facebook
      </button>
      <button
        class="filter-btn"
        [class.active]="state.selectedChannelFilter() === 'INSTAGRAM'"
        (click)="state.setChannelFilter('INSTAGRAM')"
      >
        Instagram
      </button>
    </div>

    <!-- Realtime Live AI Pill -->
    <div class="ai-realtime-pill">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ai-pill-icon">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
      </svg>
      <span>{{ state.isAiActive() ? 'Realtime AI Active' : 'AI Paused' }}</span>
      <span class="status-dot" [class.status-dot-active]="state.isAiActive()"></span>
    </div>

    <!-- Notifications Bell -->
    <button class="header-icon-btn" title="Thông báo hệ thống">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="notification-badge"></span>
    </button>

    <!-- Primary Action CTA -->
    @if (actionText) {
      <button class="btn btn-primary header-cta" (click)="onAction()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>{{ actionText }}</span>
      </button>
    }
  </div>
</header>
